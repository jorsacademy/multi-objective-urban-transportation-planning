name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests bike_share_optimizer.py

      - name: Run tests
        run: pytest --cov=bike_share_optimizer --cov-report=term-missing

      - name: Smoke-test package entry point
        run: python -m bike_share_optimizer > /dev/null
