name: Feature request
description: Propose an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Describe the user or modeling problem first, then the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or use case should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired API, behavior, or modeling approach.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you considered.
  - type: textarea
    id: evidence
    attributes:
      label: Data, references, or examples
      description: Add datasets, papers, examples, or pseudo-code if they help explain the proposal.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request is scoped to bike-share planning, optimization, or project tooling.
          required: true
